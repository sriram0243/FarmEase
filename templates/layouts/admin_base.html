<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard - FarmEase{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Admin & Core CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="admin-body">

    <div class="d-flex" id="wrapper">
        <!-- Admin Sidebar -->
        <aside class="admin-sidebar bg-dark text-white" id="sidebar-wrapper">
            <div class="sidebar-heading px-4 py-3 border-bottom border-secondary">
                <h4 class="mb-0 text-success fw-bold">🌾 FarmEase <span class="badge bg-warning text-dark fs-6 ms-1">Admin</span></h4>
            </div>
            <div class="list-group list-group-flush py-3">
                <a href="/admin" class="list-group-item list-group-item-action bg-dark text-white px-4 py-3 border-0">
                    <i class="fa-solid fa-chart-line me-3 text-warning"></i> Dashboard
                </a>
                <a href="/admin/equipment" class="list-group-item list-group-item-action bg-dark text-white px-4 py-3 border-0">
                    <i class="fa-solid fa-tractor me-3 text-success"></i> Equipment
                </a>
                <a href="/admin/bookings" class="list-group-item list-group-item-action bg-dark text-white px-4 py-3 border-0">
                    <i class="fa-solid fa-calendar-check me-3 text-info"></i> Bookings
                </a>
                <a href="/admin/users" class="list-group-item list-group-item-action bg-dark text-white px-4 py-3 border-0">
                    <i class="fa-solid fa-users me-3 text-primary"></i> Users
                </a>
                <div class="mt-4 px-4">
                    <a href="{{ url_for('home') }}" class="btn btn-outline-light btn-sm w-100 rounded-pill mb-2">
                        <i class="fa-solid fa-globe me-2"></i> View Site
                    </a>
                    <a href="/logout" class="btn btn-danger btn-sm w-100 rounded-pill">
                        <i class="fa-solid fa-right-from-bracket me-2"></i> Logout
                    </a>
                </div>
            </div>
        </aside>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100 bg-light">
            <!-- Top Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4 py-3">
                <div class="container-fluid p-0">
                    <h5 class="mb-0 fw-bold">{% block header_title %}Admin Control Panel{% endblock %}</h5>
                    <div class="ms-auto d-flex align-items-center gap-3">
                        <span class="text-muted small">Logged in as <strong>Admin</strong></span>
                        <div class="avatar bg-success text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px; font-weight: 600;">A</div>
                    </div>
                </div>
            </nav>

            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
